<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>knoot lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.3.0/xterm.min.css">
<style>
  :root {
    --bg: #12161a; --panel: #171c21; --panel-2: #1d232a; --rule: #2b3238; --rule-2: #222830;
    --text: #e8ecef; --text-2: #aab2ba; --dim: #7d868f;
    --held: #19a974; --blocked: #ff4a1f; --wire: #3b7bff; --warn: #f0b429;
    --sans: 'Instrument Sans', system-ui, sans-serif;
    --mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); display: flex; flex-direction: column; overflow: hidden; -webkit-font-smoothing: antialiased; }
  header { display: flex; align-items: center; gap: 20px; flex: none; height: 48px; padding: 0 16px; border-bottom: 1px solid var(--rule); background: var(--panel); }
  .brand { font-weight: 600; font-size: 16px; display: flex; align-items: center; gap: 9px; }
  .brand span { color: var(--text-2); font-weight: 400; font-size: 13.5px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: var(--blocked); transition: background .3s; }
  .dot.on { background: var(--held); }
  .repo { color: var(--dim); font-size: 12.5px; font-family: var(--mono); }
  a.link { color: var(--text-2); font-size: 13px; }
  a.link:hover { color: var(--text); }
  .counts { margin-left: auto; display: flex; gap: 20px; font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .counts b { font-weight: 500; color: var(--text); font-family: var(--mono); margin-right: 5px; }
  .counts .hot b { color: var(--blocked); } .counts .warn b { color: var(--warn); }

  main { flex: 1; display: grid; grid-template-columns: 1fr 400px; min-height: 0; }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; } }
  #terms { display: grid; grid-template-rows: 1fr 1fr; min-height: 0; min-width: 0; }
  #terms.quad { grid-template-columns: 1fr 1fr; }
  .term { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .term-bar { flex: none; display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--rule); }
  .who { font-family: var(--mono); font-size: 13px; }
  .tag { font-size: 12.5px; color: var(--dim); }
  .holding { margin-left: auto; display: flex; gap: 12px; flex-wrap: wrap; justify-content: flex-end; font-family: var(--mono); font-size: 12px; }
  .chip { color: var(--held); }
  .chip.blocked { color: var(--blocked); font-family: var(--sans); font-size: 12.5px; }
  .chip.idle { color: var(--dim); font-family: var(--sans); font-size: 12.5px; }
  .screen { flex: 1; min-height: 0; padding: 6px 8px; background: var(--bg); }
  .screen .xterm { height: 100%; }

  aside { display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
  aside h2 { margin: 0; height: 34px; padding: 0 14px; font-size: 14px; font-weight: 500; border-bottom: 1px solid var(--rule); display: flex; align-items: center; gap: 10px; }
  aside h2 .tag.live { color: var(--held); }
  #feed { flex: 1; overflow-y: auto; min-height: 0; font-family: var(--mono); font-size: 12px; }
  .ev { display: grid; grid-template-columns: 62px 58px 96px 1fr; gap: 10px; padding: 5px 14px; border-bottom: 1px solid var(--rule-2); color: var(--text-2); align-items: baseline; font-variant-numeric: tabular-nums; }
  .ev time { color: var(--dim); }
  .ev .u { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ev .k { font-weight: 500; }
  .ev .d { overflow-wrap: anywhere; }
  .ev.new { animation: rowin .5s ease-out; }
  @keyframes rowin { from { background: var(--panel-2); } to { background: transparent; } }
  .k.claim { color: var(--held); } .k.blocked { color: var(--blocked); } .k.ungated, .k.merge { color: var(--warn); }
  .k.joined, .k.freed { color: var(--wire); } .k.wrote, .k.intent, .k.left, .k.released { color: var(--text-2); }
  .ev.blocked { background: rgba(255,74,31,.06); }
  .ev.ungated { background: rgba(240,180,41,.06); }
  .empty { padding: 22px 14px; color: var(--text-2); font-family: var(--sans); font-size: 13.5px; }
  .hint { flex: none; padding: 8px 14px; border-top: 1px solid var(--rule); color: var(--dim); font-size: 12.5px; }
  @media (prefers-reduced-motion: reduce) { .ev.new { animation: none; } }
</style>

<header>
  <div class="brand"><span class="dot" id="dot"></span>knoot <span>lab</span></div>
  <span class="repo" id="repo"></span>
  <a class="link" href="/ops">Operator view</a>
  <div class="counts">
    <span><b id="s-claims">0</b>claims</span>
    <span><b id="s-writes">0</b>writes</span>
    <span id="w-blocked"><b id="s-blocked">0</b>blocked</span>
    <span id="w-ungated"><b id="s-ungated">0</b>ungated</span>
  </div>
</header>

<main>
  <div id="terms"></div>
  <aside>
    <h2>Ledger <span id="live-tag" class="tag"></span></h2>
    <div id="feed"><div class="empty">Waiting for activity.</div></div>
    <div class="hint">Click a terminal to type. Give both agents the same file to see a block.</div>
  </aside>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.3.0/xterm.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xterm-addon-fit/0.8.0/xterm-addon-fit.min.js"></script>
<script>
// A hosted relay requires a token. A browser cannot set headers on these,
// so it travels as ?token= — taken from this page's own URL, and remembered
// so a reload does not need it again.
const TOKEN = (() => {
  const q = new URLSearchParams(location.search).get('token');
  try {
    if (q) { sessionStorage.setItem('knootToken', q); return q; }
    return sessionStorage.getItem('knootToken') || '';
  } catch (_) { return q || ''; }
})();
const withTok = (u) => TOKEN ? u + (u.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(TOKEN) : u;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hhmm = ts => new Date(ts).toLocaleTimeString([], {hour12:false});
const short = s => String(s).slice(0,8);

let repo = null, sessions = new Map(), claims = [], agents = [];
let stats = {writes:0, blocked:0, ungated:0};
const blockedFlash = new Map();   // agent name -> until timestamp

const THEME = {
  background:'#12161a', foreground:'#e8ecef', cursor:'#3b7bff',
  black:'#12161a', red:'#ff4a1f', green:'#19a974', yellow:'#f0b429',
  blue:'#3b7bff', magenta:'#b48eff', cyan:'#39c5cf', white:'#e8ecef',
  brightBlack:'#7d868f', brightRed:'#ff7b5c', brightGreen:'#3fc98f',
  brightYellow:'#f5c85c', brightBlue:'#6d9cff', brightMagenta:'#cbb0ff',
  brightCyan:'#5ed5dd', brightWhite:'#ffffff',
};

function mountTerm(idx, name){
  const wrap = document.createElement('div');
  wrap.className = 'term';
  wrap.innerHTML = `<div class="term-bar">
      <span class="who">${esc(name)}</span><span class="tag">Claude Code</span>
      <span class="holding" id="hold-${idx}"><span class="chip idle">holding nothing</span></span>
    </div><div class="screen" id="screen-${idx}"></div>`;
  $('terms').appendChild(wrap);

  const term = new Terminal({
    fontFamily:"'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace",
    fontSize:12, lineHeight:1.15, cursorBlink:true, scrollback:5000,
    theme:THEME, allowProposedApi:true,
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open($(`screen-${idx}`));

  const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  let ws, dead = false;
  const open = () => {
    ws = new WebSocket(withTok(`${proto}${location.host}/term/ws/${idx}`));
    ws.binaryType = 'arraybuffer';
    ws.onopen = () => { fitNow(); };
    ws.onmessage = e => term.write(new Uint8Array(e.data));
    ws.onclose = () => { if (!dead) setTimeout(open, 1500); };
  };
  const fitNow = () => {
    try { fit.fit(); } catch {}
    if (ws && ws.readyState === 1)
      ws.send(JSON.stringify({cols: term.cols, rows: term.rows}));
  };
  term.onData(d => { if (ws && ws.readyState === 1) ws.send(new TextEncoder().encode(d)); });
  new ResizeObserver(() => fitNow()).observe($(`screen-${idx}`));
  open();
  return {term, fitNow};
}

async function boot(){
  const info = await fetch(withTok('/api/terms')).then(r => r.json()).catch(() => ({agents:[]}));
  agents = info.agents || [];
  if (!agents.length){
    $('terms').innerHTML = '<div class="empty">No terminals. Start the relay with --lab-dir to host agents here.</div>';
  } else {
    const box = $('terms');
    if (agents.length > 2){
      box.classList.add('quad');
      box.style.gridTemplateRows = `repeat(${Math.ceil(agents.length/2)}, 1fr)`;
    } else {
      box.style.gridTemplateRows = `repeat(${agents.length}, 1fr)`;
    }
    agents.forEach((n, i) => mountTerm(i, n));
  }

  const repos = await fetch(withTok('/api/repos')).then(r => r.json()).catch(() => []);
  repo = repos[0];
  $('repo').textContent = info.dir ? `${info.dir}` : (repo || '');
  if (repo){ await history(); connect(); }
}

async function history(){
  const evs = await fetch(withTok('/api/events?repo=' + encodeURIComponent(repo))).then(r => r.json()).catch(() => []);
  for (const e of evs) apply(e, false);
  render();
}

function connect(){
  const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  const ws = new WebSocket(withTok(proto + location.host + '/ws'));
  ws.onopen = () => {
    $('dot').classList.add('on'); $('live-tag').textContent = 'live'; $('live-tag').className = 'tag live';
    ws.send(JSON.stringify({type:'hello', repo, daemon:'lab-web'}));
  };
  ws.onmessage = m => {
    const msg = JSON.parse(m.data);
    if (msg.type === 'welcome'){
      sessions = new Map((msg.sessions||[]).map(s => [s.session, s]));
      claims = msg.claims || [];
    } else if (msg.type === 'event'){
      apply(msg.event, true);
    }
    render();
  };
  ws.onclose = () => {
    $('dot').classList.remove('on'); $('live-tag').textContent = 'reconnecting'; $('live-tag').className = 'tag';
    setTimeout(connect, 2000);
  };
}

function apply(e, live){
  const t = e.type;
  if (t === 'session_started')
    sessions.set(e.session, {session:e.session, user:e.user, branch:e.branch, intent:'', last_seen:e.ts});
  else if (t === 'intent_declared'){
    const s = sessions.get(e.session); if (s){ s.intent = e.text; s.last_seen = e.ts; }
  } else if (t === 'claim_acquired'){
    const c = claims.find(c => c.session === e.session && c.path === e.path);
    if (c) c.lease_until = e.lease_until;
    else claims.push({session:e.session, user:e.user, path:e.path, lease_until:e.lease_until});
  } else if (t === 'claim_released')
    claims = claims.filter(c => !(c.session === e.session && c.path === e.path));
  else if (t === 'file_written') stats.writes++;
  else if (t === 'claim_denied'){
    stats.blocked++;
    if (live) blockedFlash.set(e.user, Date.now() + 8000);
  }
  else if (t === 'ungated_write') stats.ungated++;
  else if (t === 'session_ended'){
    sessions.delete(e.session);
    claims = claims.filter(c => c.session !== e.session);
  }
  feed(e, live);
}

const KIND = {
  session_started:['joined','session_started'], intent_declared:['intent','intent_declared'],
  claim_acquired:['claim','claim_acquired'], claim_released:['released','claim_released'],
  path_freed:['freed','path_freed'], message:['freed','message'],
  file_written:['wrote','file_written'], claim_denied:['blocked','claim_denied'],
  cross_branch_overlap:['merge','cross_branch_overlap'],
  ungated_write:['ungated','ungated_write'], session_ended:['left','session_ended'],
};

function feed(e, live){
  const [cls, label] = KIND[e.type] || ['intent', e.type];
  const who = e.user || sessions.get(e.session)?.user || short(e.session);
  let detail = '';
  if (e.type === 'intent_declared') detail = e.text;
  else if (e.type === 'claim_denied') detail = `${e.path}, held by ${e.holder_user}`;
  else if (e.type === 'ungated_write') detail = `${e.path}, wrote over ${e.holder_user}`;
  else if (e.type === 'message') detail = `to ${e.to || 'all'}: ${e.text || ''}`;
  else if (e.path) detail = e.path;
  else if (e.type === 'session_started') detail = e.branch;

  const row = document.createElement('div');
  row.className = 'ev ' + (e.type === 'claim_denied' ? 'blocked' : e.type === 'ungated_write' ? 'ungated' : '') + (live ? ' new' : '');
  row.innerHTML = `<time>${hhmm(e.ts || Date.now())}</time><span class="u">${esc(who)}</span>`
    + `<span class="k ${cls}">${label}</span><span class="d">${esc(detail)}</span>`;
  const f = $('feed');
  if (f.querySelector('.empty')) f.innerHTML = '';
  f.appendChild(row);
  while (f.children.length > 400) f.removeChild(f.firstChild);
  f.scrollTop = f.scrollHeight;
}

function render(){
  const now = Date.now();
  claims = claims.filter(c => c.lease_until > now);
  $('s-claims').textContent = claims.length;
  $('s-writes').textContent = stats.writes;
  $('s-blocked').textContent = stats.blocked;
  $('s-ungated').textContent = stats.ungated;
  $('w-blocked').className = stats.blocked ? 'hot' : '';
  $('w-ungated').className = stats.ungated ? 'warn' : '';

  agents.forEach((name, i) => {
    const box = $(`hold-${i}`); if (!box) return;
    const mine = claims.filter(c => c.user === name);
    const flash = (blockedFlash.get(name) || 0) > now;
    let html = mine.length
      ? mine.map(c => `<span class="chip">${esc(c.path)} ${Math.max(0, Math.round((c.lease_until-now)/60000))} min</span>`).join('')
      : '<span class="chip idle">holding nothing</span>';
    if (flash) html = '<span class="chip blocked">blocked</span>' + html;
    box.innerHTML = html;
  });
}

setInterval(render, 1000);
boot();
</script>
