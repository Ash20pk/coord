# Build the Linux binary here, not on the box it runs on.
#
# The droplet is 1 vCPU / 961 MB: a release build with LTO needs a 2 GB
# swapfile to link at all, takes minutes, and competes for memory with the
# relay it is about to replace. Building here and downloading there makes a
# deploy a 30-second file copy.
#
# musl, statically linked, so one artifact runs on any Linux without caring
# which glibc the host shipped.
name: release

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the musl target
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools
          rustup target add x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      # The web front end is embedded into the binary, so it has to exist
      # before rustc runs. Building it here also means a broken front end
      # fails the release rather than shipping a stale one.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the web front end
        env:
          # The publishable key is public by design and ends up in the bundle.
          # The secret key is never built in; the relay reads it at run time.
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Test
        run: cargo test --locked

      - name: Build
        env:
          # rusqlite bundles SQLite as C, and ring builds assembly; both need
          # to be told to use the musl toolchain rather than the host's.
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Package
        run: |
          install -m 0755 target/x86_64-unknown-linux-musl/release/knoot knoot-x86_64-linux
          # Statically linked, or the whole point — one artifact that runs on
          # any Linux regardless of its glibc — is lost. `file` is the
          # authority here: musl produces a static-pie, for which `ldd` prints
          # "statically linked" rather than "not a dynamic executable", so
          # grepping ldd fails a binary that is in fact fine.
          file knoot-x86_64-linux
          file knoot-x86_64-linux | grep -qE "static-pie linked|statically linked" \
            || { echo "binary is not statically linked"; exit 1; }
          ./knoot-x86_64-linux --version
          sha256sum knoot-x86_64-linux > knoot-x86_64-linux.sha256
          cat knoot-x86_64-linux.sha256

      # A single moving tag the provisioner can always point at, plus the
      # commit it was built from so a deploy is traceable to a revision.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          gh release create nightly \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "nightly ($(git rev-parse --short "$GITHUB_SHA"))" \
            --notes "Static x86_64 Linux build of $(git rev-parse --short "$GITHUB_SHA"): $(git log -1 --format=%s "$GITHUB_SHA")" \
            knoot-x86_64-linux knoot-x86_64-linux.sha256
