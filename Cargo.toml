[package]
name = "knoot"
version = "0.1.0"
edition = "2021"
description = "Realtime coordination layer for coding agents — a sequenced event log with claims, leases, and conflict briefs."

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
# tokio-tungstenite pulls rustls 0.23 in with no provider feature, which makes
# the provider a runtime choice — and an uninstalled one panics on first
# `wss://` handshake. Naming `ring` here is what makes that choice.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
futures-util = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
dirs = "5"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
toml = "0.8"
terminal_size = "0.3"
portable-pty = "0.8"
# The console signs people in with Supabase, which means one outbound HTTPS
# call to verify an access token. rustls is already in the tree for wss://.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
# The web app is built by Vite and embedded, so the relay is still one binary
# serving its own front end with no second deploy and no CORS.
include_dir = "0.7"
openmls = "0.8.1"
openmls_rust_crypto = "0.5.1"
openmls_basic_credential = "0.5.0"
openmls_traits = "0.5.0"
chacha20poly1305 = "0.11.0"

[profile.release]
lto = true
strip = true

[dev-dependencies]
futures-util = "0.3"
tokio-tungstenite = "0.23"
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
