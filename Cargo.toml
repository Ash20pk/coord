[package]
name = "coord"
version = "0.1.0"
edition = "2021"
description = "Realtime coordination layer for coding agents — a sequenced event log with claims, leases, and conflict briefs."

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tokio-tungstenite = "0.23"
futures-util = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
dirs = "5"
uuid = { version = "1", features = ["v4"] }
toml = "0.8"

[profile.release]
lto = true
strip = true

[dev-dependencies]
futures-util = "0.3"
tokio-tungstenite = "0.23"
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
